<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 06: js orientado a objetos </title>
</head>
<body>
    <h1> Repositorio para Disciplina de Design Web</h1>
    <h1>Data: 21/10/2026</h1>
    <table>
        <tr>
            <th>objeto</th>
            <th>ações</th>
        </tr>
        <tr>
            <td>zeus</td>
        </tr>
        <td>
            <button onclick="zeus.falar()">falar</button>
            <button onclick="zeus.comer(0.5)">comer</button>
            <button onclick="zeus.cagar(0.2)">cagar</button>
            <button onclick="zeus.saudar()">saudar</button>
        </td>
        <tr>
            <td>lecy</td>
        <td>
            <button onclick="lecy.falar()">falar</button>
            <button onclick="lecy.comer(1.9)">comer</button>
            <button onclick="lecy.cagar(0.5)">cagar</button>
            <button onclick="lecy.saudar()">saudar</button>
        </td>
        </tr>
        <tr>
            <td>leleco</td>
        <td>
            <button onclick="leleco.falar()">falar</button>
            <button onclick="leleco.comer(0.1)">comer</button>
            <button onclick="leleco.cagar(0.5)">cagar</button>
            <button onclick="leleco.saudar()">saudar</button>
        </td>
        </tr>
        <tr>
            <td>priscila</td>
        <td>
            <button onclick="priscila.falar()">falar</button>
            <button onclick="priscila.comer(2.1)">comer</button>
            <button onclick="priscila.cagar(0.5)">cagar</button>
            <button onclick="priscila.saudar()">saudar</button>
        </td>
        </tr>
    </table>
    <script defer src="./js/script6.js"></script>
</body>
</html>
